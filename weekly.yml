name: Haftalik guncelleme
on:
  schedule:
    - cron: "0 6 * * 1"   # her Pazartesi 06:00 UTC (09:00 TSİ)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python karsiyaka_tracker.py
      - name: Commit
        run: |
          git config user.name "tracker-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs && (git diff --cached --quiet || git commit -m "Haftalık güncelleme" && git push)
